<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>マイ スケジュールアプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --ink: #26334d;
            --muted: #71809b;
            --line: #e4e9f3;
            --accent: #ff6b6b;
            --accent-dark: #e85662;
            --violet: #6657d9;
            --blue: #4d8df7;
        }
        body {
            font-family: 'Trebuchet MS', 'Yu Gothic', 'Meiryo', sans-serif;
            color: var(--ink);
            background: #f4f7fc;
            background-image: radial-gradient(circle at 8% 12%, rgba(255, 185, 92, 0.34) 0 90px, transparent 91px),
                              radial-gradient(circle at 94% 8%, rgba(105, 91, 214, 0.26) 0 140px, transparent 141px),
                              linear-gradient(145deg, #fff8f1 0%, #f4f7fc 48%, #eef1ff 100%);
            min-height: 100vh;
            padding: 34px 20px;
        }
        .container {
            max-width: 1120px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 28px;
            padding: 34px;
            box-shadow: 0 24px 70px rgba(57, 67, 115, 0.16);
            backdrop-filter: blur(14px);
        }
        h1 {
            color: var(--ink);
            margin-bottom: 28px;
            text-align: center;
            font-size: clamp(27px, 4vw, 38px);
            letter-spacing: 0.04em;
        }
        .form-section {
            background: linear-gradient(110deg, #fff0e5, #fff9f0 48%, #eef3ff);
            border: 1px solid #f4dfd7;
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 30px;
        }
        form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        input, button {
            padding: 12px 16px;
            border: 1px solid #dce2ee;
            border-radius: 11px;
            font-size: 14px;
            transition: all 0.25s ease;
        }
        input[type="text"], input[type="date"] {
            flex: 1;
            min-width: 150px;
            background: rgba(255, 255, 255, 0.92);
        }
        input:focus {
            outline: none;
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(77, 141, 247, 0.14);
        }
        button[type="submit"] {
            background: linear-gradient(135deg, var(--accent), #ff9a62);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            min-width: 110px;
        }
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(232, 86, 98, 0.28);
        }
        .month-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 18px;
        }
        .month-header h2 {
            font-size: clamp(20px, 3vw, 28px);
            color: var(--ink);
            flex: 1;
            text-align: center;
        }
        .month-nav {
            display: flex;
            gap: 12px;
        }
        .month-nav a {
            text-decoration: none;
            background: white;
            border: 1px solid var(--line);
            padding: 10px 14px;
            border-radius: 11px;
            color: var(--ink);
            font-weight: 500;
            white-space: nowrap;
            transition: all 0.25s ease;
        }
        .month-nav a:hover {
            background: var(--violet);
            border-color: var(--violet);
            color: white;
            transform: translateY(-2px);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 6px;
            background: transparent;
        }
        th, td {
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 11px;
            text-align: left;
            vertical-align: top;
            height: 136px;
        }
        th {
            background: linear-gradient(135deg, var(--violet), #8b72e8);
            color: white;
            font-weight: 600;
            text-align: center;
            height: auto;
            border: 0;
            padding: 12px 8px;
            letter-spacing: 0.08em;
        }
        th:first-child { background: linear-gradient(135deg, #ff7782, #ff9b70); }
        th:last-child { background: linear-gradient(135deg, #4d8df7, #58b4e8); }
        td { background: rgba(255, 255, 255, 0.84); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        td:hover { transform: translateY(-3px); box-shadow: 0 9px 18px rgba(82, 98, 145, 0.12); }
        .other-month {
            background: rgba(239, 242, 248, 0.65);
            color: #aab3c4;
            opacity: 0.72;
        }
        .day-number {
            font-weight: bold;
            color: var(--ink);
            margin-bottom: 10px;
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }
        td:first-child .day-number { color: var(--accent-dark); }
        td:last-child .day-number { color: #3679da; }
        .schedules-list {
            list-style: none;
            max-height: 92px;
            overflow-y: auto;
        }
        .schedule-item {
            background: linear-gradient(135deg, #6657d9, #8877e8);
            color: white;
            border-radius: 8px;
            padding: 7px 8px;
            margin-bottom: 5px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            word-break: break-word;
            transition: all 0.25s ease;
        }
        .schedule-item:hover {
            transform: translateX(2px);
            box-shadow: 0 5px 12px rgba(102, 87, 217, 0.32);
        }
        .schedule-title {
            flex: 1;
            min-width: 0;
        }
        .delete-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            border-radius: 5px;
            padding: 3px 6px;
            font-size: 11px;
            cursor: pointer;
            margin-left: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .delete-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }
        .other-month .day-number {
            color: #aab3c4;
        }
        @media (max-width: 720px) {
            body { padding: 14px 8px; }
            .container { padding: 20px 10px; border-radius: 20px; }
            .month-nav a { padding: 8px 9px; font-size: 12px; }
            table { border-spacing: 3px; }
            th, td { padding: 7px 4px; border-radius: 9px; }
            td { height: 106px; }
            .day-number { width: 24px; height: 24px; font-size: 13px; margin-bottom: 5px; }
            .schedule-item { padding: 5px; font-size: 11px; }
            .delete-btn { font-size: 9px; padding: 2px 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 予定管理アプリ</h1>

        <div class="form-section">
            <form action="/add" method="post">
                <input type="text" name="title" placeholder="予定のタイトルを入力..." required>
                <input type="date" name="date" required>
                <button type="submit">追加</button>
            </form>
        </div>

        <div class="month-header">
            <div class="month-nav">
                <a th:href="@{/(year=${prevMonth.year}, month=${prevMonth.monthValue})}">⬅ 前月</a>
            </div>
            <h2 th:text="${currentYear} + '年 ' + ${currentMonth} + '月'">2026年8月</h2>
            <div class="month-nav">
                <a th:href="@{/(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次月 ➡</a>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>日</th>
                    <th>月</th>
                    <th>火</th>
                    <th>水</th>
                    <th>木</th>
                    <th>金</th>
                    <th>土</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="week : ${calendarWeeks}">
                    <td th:each="day : ${week}"
                        th:classappend="${day.monthValue != currentMonth} ? 'other-month' : ''">
                        <div class="day-number" th:text="${day.dayOfMonth}">1</div>
                        <ul class="schedules-list">
                            <li th:each="schedule : ${scheduleMap[day.toString()]}"
                                class="schedule-item">
                                <span class="schedule-title" th:text="${schedule.title}">予定</span>
                                <a th:href="@{/delete/{id}(id=${schedule.id})}" 
                                   onclick="return confirm('削除してもよろしいですか？');"
                                   class="delete-btn">削除</a>
                            </li>
                        </ul>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
