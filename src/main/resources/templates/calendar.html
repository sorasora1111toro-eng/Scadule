<!DOCTYPE html>
<html lang="ja" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>マイ スケジュールアプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --ink: #202b3c;
            --muted: #748094;
            --line: #e8edf3;
            --accent: #5368d5;
            --accent-dark: #4356bd;
            --surface: #ffffff;
        }
        body {
            font-family: "Yu Gothic", "Meiryo", sans-serif;
            color: var(--ink);
            background: #f5f7fb;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1180px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid #edf0f5;
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 16px 48px rgba(32, 43, 60, 0.08);
        }
        h1 {
            color: var(--ink);
            margin-bottom: 26px;
            font-size: clamp(25px, 4vw, 32px);
            letter-spacing: 0.02em;
        }
        .form-section {
            background: #f8f9fc;
            border: 1px solid var(--line);
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 28px;
        }
        form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        input, button {
            min-height: 44px;
            padding: 10px 14px;
            border: 1px solid #dce2eb;
            border-radius: 9px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        input[type="text"], input[type="date"] {
            flex: 1;
            min-width: 180px;
            background: var(--surface);
        }
        input:focus-visible, button:focus-visible, a:focus-visible {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(83, 104, 213, 0.16);
        }
        button[type="submit"] {
            background: var(--accent);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            min-width: 100px;
        }
        button[type="submit"]:hover {
            background: var(--accent-dark);
        }
        .month-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
            gap: 12px;
        }
        .month-header h2 {
            font-size: clamp(19px, 3vw, 25px);
            color: var(--ink);
            flex: 1;
            text-align: center;
        }
        .month-nav {
            display: flex;
        }
        .month-nav a {
            text-decoration: none;
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 9px 13px;
            border-radius: 9px;
            color: #465267;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
        }
        .month-nav a:hover {
            background: #f2f4ff;
            border-color: #cbd2f5;
            color: var(--accent-dark);
        }
        .calendar-scroll {
            overflow-x: auto;
            border-radius: 12px;
        }
        table {
            width: 100%;
            min-width: 760px;
            border-collapse: separate;
            border-spacing: 4px;
            background: transparent;
        }
        th, td {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px;
            text-align: left;
            vertical-align: top;
            height: 132px;
        }
        th {
            background: #f5f6fa;
            color: #626e80;
            font-weight: 600;
            text-align: center;
            height: auto;
            border-color: #eef0f5;
            padding: 11px 8px;
            letter-spacing: 0.04em;
        }
        th:first-child { color: #c65c68; }
        th:last-child { color: #4e78bb; }
        td { background: var(--surface); transition: background 0.2s ease, border-color 0.2s ease; }
        td:hover { background: #fbfcff; border-color: #d8deef; }
        .other-month {
            background: #fafbfc;
            color: #a7afbd;
        }
        .day-number {
            font-weight: 600;
            color: #3d485b;
            margin-bottom: 8px;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            border-radius: 8px;
        }
        td:first-child .day-number { color: #c65c68; }
        td:last-child .day-number { color: #4e78bb; }
        .schedules-list {
            list-style: none;
            max-height: 84px;
            overflow-y: auto;
        }
        .schedule-item {
            background: #eef0ff;
            color: #414d91;
            border: 1px solid #e4e7fc;
            border-radius: 7px;
            padding: 6px 7px;
            margin-bottom: 4px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            word-break: break-word;
            transition: background 0.2s ease, border-color 0.2s ease;
        }
        .schedule-item:hover { background: #e7eaff; border-color: #d8defa; }
        .schedule-title {
            flex: 1;
            min-width: 0;
        }
        .delete-btn {
            background: transparent;
            color: #6d7691;
            border: none;
            border-radius: 4px;
            padding: 3px 5px;
            font-size: 10px;
            cursor: pointer;
            margin-left: 4px;
            white-space: nowrap;
            text-decoration: none;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .delete-btn:hover {
            background: #fff0f1;
            color: #bd4655;
        }
        .other-month .day-number {
            color: #a7afbd;
        }
        @media (max-width: 600px) {
            body { padding: 16px 10px; }
            .container { padding: 22px 14px; border-radius: 15px; }
            h1 { margin-bottom: 20px; }
            .form-section { padding: 12px; margin-bottom: 22px; }
            input[type="text"], input[type="date"] { flex-basis: 100%; }
            button[type="submit"] { width: 100%; }
            .month-header { gap: 6px; }
            .month-nav a { padding: 8px 9px; font-size: 12px; }
            table { border-spacing: 3px; }
            th, td { padding: 8px; }
            td { height: 124px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>予定管理アプリ</h1>

        <div class="form-section">
            <form action="/add" method="post">
                <input type="text" name="title" placeholder="予定のタイトルを入力..." aria-label="予定のタイトル" required>
                <input type="date" name="date" aria-label="予定の日付" required>
                <button type="submit">追加</button>
            </form>
        </div>

        <div class="month-header">
            <div class="month-nav">
                <a th:href="@{/(year=${prevMonth.year}, month=${prevMonth.monthValue})}">⬅ 前月</a>
            </div>
            <h2 th:text="${currentYear} + '年 ' + ${currentMonth} + '月'">2026年8月</h2>
            <div class="month-nav">
                <a th:href="@{/(year=${nextMonth.year}, month=${nextMonth.monthValue})}">次月 ➡</a>
            </div>
        </div>

        <div class="calendar-scroll">
            <table>
                <thead>
                    <tr>
                        <th scope="col">日</th>
                        <th scope="col">月</th>
                        <th scope="col">火</th>
                        <th scope="col">水</th>
                        <th scope="col">木</th>
                        <th scope="col">金</th>
                        <th scope="col">土</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="week : ${calendarWeeks}">
                        <td th:each="day : ${week}"
                            th:classappend="${day.monthValue != currentMonth} ? 'other-month' : ''">
                            <div class="day-number" th:text="${day.dayOfMonth}">1</div>
                            <ul class="schedules-list">
                                <li th:each="schedule : ${scheduleMap[day.toString()]}"
                                    class="schedule-item">
                                    <span class="schedule-title" th:text="${schedule.title}">予定</span>
                                    <a th:href="@{/delete/{id}(id=${schedule.id})}"
                                       onclick="return confirm('削除してもよろしいですか？');"
                                       class="delete-btn">削除</a>
                                </li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
