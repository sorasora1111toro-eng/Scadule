plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'com.h2database:h2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

jar {
    archiveFileName = 'ScaduleDesktop.jar'
    manifest {
        attributes 'Main-Class': 'com.example.demo.DesktopScheduleApp'
    }
}

tasks.register('fatJar', Jar) {
    archiveFileName = 'ScaduleDesktop-fat.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.example.demo.DesktopScheduleApp'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    with jar
}

tasks.register('packageWinExe', Exec) {
    dependsOn 'fatJar'
    def packageInput = layout.buildDirectory.dir('package-input')
    doFirst {
        delete packageInput
        copy {
            from tasks.named('fatJar').get().archiveFile
            into packageInput
        }
        delete layout.buildDirectory.dir('appimage')
    }
    executable = 'C:/Program Files/Java/jdk-26.0.1/bin/jpackage.exe'
    commandLine executable,
        '--type', 'app-image',
        '--name', 'ScaduleDesktop',
        '--app-version', '1.0.0',
	
        '--input', packageInput.get().asFile,
        '--main-jar', 'ScaduleDesktop-fat.jar',
        '--main-class', 'com.example.demo.DesktopScheduleApp',
        '--dest', 'build/appimage'
}

tasks.register('runDesktop', JavaExec) {
    group = 'application'
    description = 'Runs the Scadule Swing desktop application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.example.demo.DesktopScheduleApp'
}

bootRun {
    mainClass = 'com.example.demo.DemoApplication'
}
